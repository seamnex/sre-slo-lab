# Ruteo por severidad: `page` despierta a alguien, `ticket` no.
#
# En el lab, los dos receptores terminan en el mismo webhook (el notificador),
# pero el ruteo es el real: cambiar la URL de `pager` por PagerDuty u Opsgenie
# no requiere tocar nada más.
route:
  receiver: ticket
  group_by: [alertname, slo]
  # Cuánto esperar para agrupar alertas del mismo grupo antes del primer aviso.
  # Corto para `page`: cada segundo de espera es tiempo de detección.
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: pager
      group_wait: 0s
    - matchers: [severity="ticket"]
      receiver: ticket
      group_wait: 1m

receivers:
  - name: pager
    webhook_configs:
      - url: http://notificador:9099/pager
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url: http://notificador:9099/ticket
        send_resolved: true

# Si la disponibilidad ya está quemando budget rápido, el aviso lento sobre el
# mismo SLO no agrega nada: es el mismo incidente, contado dos veces.
inhibit_rules:
  - source_matchers: [alertname="SLOQuemaRapida"]
    target_matchers: [alertname="SLOQuemaLenta"]
    equal: [slo]
