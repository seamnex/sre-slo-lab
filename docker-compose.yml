# SRE SLO Lab: servicio instrumentado + carga + Prometheus + Alertmanager + Grafana.
#
#   docker compose up -d --build
#
#   Grafana        http://localhost:3000   (dashboard "SLOs — Checkout", sin login)
#   Prometheus     http://localhost:9090
#   Alertmanager   http://localhost:9093
#   Servicio       http://localhost:8080   (POST /admin/falla para inyectar fallas)
#
# NO usar esta configuración en producción: Grafana tiene acceso anónimo y la
# API de fallas del servicio no tiene autenticación.

# Los tres procesos de Python usan la misma imagen: se construye una vez (en
# `servicio`) y los otros dos la reutilizan.
x-python: &python
  image: sre-slo-lab-python:local
  pull_policy: never
  restart: unless-stopped

services:
  servicio:
    <<: *python
    build: ./app
    command: ["python", "servicio.py"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  carga:
    <<: *python
    command: ["python", "carga.py"]
    environment:
      URL: http://servicio:8080/api/checkout
      RPS: "10"
    depends_on:
      servicio:
        condition: service_healthy

  notificador:
    <<: *python
    command: ["python", "notificador.py"]
    ports:
      - "9099:9099"

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/reglas:/etc/prometheus/reglas:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
